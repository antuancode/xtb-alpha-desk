services:
  alphadesk:
    build: .
    container_name: alphadesk
    # Se reinicia solo tras un corte de luz o un reinicio de la Raspberry Pi.
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ALPHADESK_DATA_DIR: /data
      # Obligatorias: sin ellas el contenedor no arranca (no hay valores por defecto).
      ALPHADESK_SECRET: ${ALPHADESK_SECRET:?define ALPHADESK_SECRET en el archivo .env}
      ALPHADESK_PASSWORD: ${ALPHADESK_PASSWORD:?define ALPHADESK_PASSWORD en el archivo .env}
      # Opcional: credenciales de XTB por entorno (tienen prioridad sobre las del panel).
      XTB_USER_ID: ${XTB_USER_ID:-}
      XTB_PASSWORD: ${XTB_PASSWORD:-}
      XTB_ACCOUNT: ${XTB_ACCOUNT:-real}
    volumes:
      - alphadesk-data:/data

volumes:
  alphadesk-data:
